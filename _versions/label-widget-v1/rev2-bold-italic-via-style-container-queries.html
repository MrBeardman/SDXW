<widget>

	<!-- CONFIG -->
	<script type="application/json" id="widget-config">
		{
		"hrid": "label-widget-v1",
		"display": "Label Widget V1",
		"description": "A simple text label - text, font size, bold, italic, color, alignment.",
		"category": "General",
		"type": "widget",
		"layoutUnique": false,
		"icon": "format-text",
		"iconColor": "#96C21F",
		"options": [
			{ "key": "text", "label": "Text", "type": "text", "default": "Label" },
			{ "key": "font-size", "label": "Font Size (px)", "type": "text", "default": "16" },
			{ "key": "bold", "label": "Bold", "type": "boolean", "default": false },
			{ "key": "italic", "label": "Italic", "type": "boolean", "default": false },
			{ "key": "text-color", "label": "Font Color", "type": "color", "default": "#213B33" },
			{
				"key": "text-align",
				"label": { "en": "Alignment", "de": "Ausrichtung" },
				"type": "select",
				"default": "left",
				"options": [
					{ "label": { "en": "Left", "de": "Links" }, "value": "left" },
					{ "label": { "en": "Center", "de": "Mittig" }, "value": "center" },
					{ "label": { "en": "Right", "de": "Rechts" }, "value": "right" }
				]
			}
		]
		}
	</script>

	<!-- STYLE -->
	<style id="widget-styles">

		@scope {

			#widget-body {

				/* "left"/"center"/"right" are valid text-align keywords, so the select value
				   flows straight into CSS - same mechanism as button-widget-v1 */
				text-align: var(--widget-text-align);

				#label {
					margin: 0;
					/* bare number in the option, unit appended here (see patterns.md's
					   "type: text must be a single unbroken CSS token" gotcha) */
					font-size: calc(var(--widget-font-size) * 1px);
					color: var(--widget-text-color);

					/* Boolean options arrive in CSS as the literal token `true`/`false`. A style
					   container query reads that token off the nearest ancestor (#widget-body,
					   which inherits the --widget-* vars) - so bold/italic need no JS at all */
					@container style(--widget-bold: true) {
						font-weight: bold;
					}

					@container style(--widget-italic: true) {
						font-style: italic;
					}
				}
			}
		}

	</style>

	<!-- TAGS -->
	<!-- No loading/active/error state machine - synchronous and config-only (see patterns.md) -->
	<div id="widget-body">
		<p id="label" widget-text="text"></p>
	</div>

	<!-- SCRIPT -->
	<script id="widget-script">

		(function () {

			// Uses
			const sdx = window.sdx;

			// Widget
			const widget = sdx.Widget.getInstance();

			// widget-text (data-attributes-lib) fills the label; everything else - including
			// the bold/italic toggles via @container style() queries - is CSS
			widget.ready();

		})();

	</script>

</widget>
