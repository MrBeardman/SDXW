<!--
A button that opens a link, optionally in a new tab - text, colors (with hover pairs), border
radius, alignment. Every option is wired declaratively (data-attributes-lib + CSS) - the script
is widget.ready() only. All option labels are localized (en/de).
//-->
<widget>

	<!-- CONFIG -->
	<script type="application/json" id="widget-config">
		{
		"hrid": "button-widget-v1",
		"display": "Button Widget V1",
		"description": "A simple, configurable button - alignment, colors, border radius, link.",
		"category": "AI Examples/Basic",
		"type": "widget",
		"layoutUnique": false,
		"icon": "gesture-tap-button",
		"iconColor": "#96C21F",
		"options": [
			{
				"key": "text-align",
				"label": { "en": "Alignment", "de": "Ausrichtung" },
				"type": "select",
				"default": "start",
				"options": [
					{ "label": { "en": "Left", "de": "Links" }, "value": "start" },
					{ "label": { "en": "Center", "de": "Mittig" }, "value": "center" },
					{ "label": { "en": "Right", "de": "Rechts" }, "value": "end" }
				]
			},
			{ "key": "display", "label": { "en": "Button Text", "de": "Button-Text" }, "type": "text", "default": "Click here" },
			{ "key": "link", "label": { "en": "Link", "de": "Link" }, "type": "text", "default": "#" },
			{ "key": "link-new-tab", "label": { "en": "Open in New Tab", "de": "In neuem Tab öffnen" }, "type": "boolean", "default": "false" },
			{ "key": "text-color", "label": { "en": "Text Color", "de": "Text Farbe" }, "type": "color", "default": "#FFFFFF" },
			{ "key": "text-color-hover", "label": { "en": "Text Color Hover", "de": "Text Farbe Hover" }, "type": "color", "default": "#FFFFFF" },
			{ "key": "background-color", "label": { "en": "Background Color", "de": "Hintergrundfarbe" }, "type": "color", "default": "#96C21F" },
			{ "key": "background-color-hover", "label": { "en": "Background Color Hover", "de": "Hintergrundfarbe Hover" }, "type": "color", "default": "#7FA519" },
			{ "key": "button-border-radius", "label": { "en": "Border Radius (px)", "de": "Eckradius (px)" }, "type": "text", "default": "8" }
		]
		}
	</script>

	<!-- STYLE -->
	<style id="widget-styles">

		@scope {

			#widget-body {

				/* "start"/"center"/"end" are valid text-align keywords, so the select value flows
				   straight into CSS. start/end (not left/right) follow the reading direction, so
				   rtl works without a flex container - and every line of a multi-line button
				   label aligns, not just the block (see label-widget-v1) */
				text-align: var(--widget-text-align);

				/* border-radius is a bare number (see patterns.md's "type: text must be a
				   single unbroken CSS token" gotcha) - unit appended via calc(), not stored in
				   the option value itself */
				--button-border-radius: calc(var(--widget-button-border-radius) * 1px);

				#button {
					display: inline-block;
					padding: 10px 20px;
					text-decoration: none;
					border-radius: var(--button-border-radius);
					color: var(--widget-text-color);
					background-color: var(--widget-background-color);
				}

				#button:hover {
					color: var(--widget-text-color-hover);
					background-color: var(--widget-background-color-hover);
				}
			}
		}

	</style>

	<!-- TAGS -->
	<!-- No loading/active/error state machine - this widget is synchronous and config-only,
	     nothing to wait for and nothing that can fail (see patterns.md) -->
	<div id="widget-body">
		<a id="button" href="#" widget-text="display" widget-link="link" widget-link-new-tab="link-new-tab"></a>
	</div>

	<!-- SCRIPT -->
	<script id="widget-script">

		(function () {

			// Uses
			const sdx = window.sdx;

			// Widget
			const widget = sdx.Widget.getInstance();

			// widget-text / widget-link / widget-link-new-tab (data-attributes-lib) handle
			// everything this widget needs declaratively - see the TAGS block. target="_blank"
			// already implies the same window.opener-blocking behavior as an explicit
			// rel="noopener" in every current browser (MDN: developer.mozilla.org/en-US/docs/
			// Web/HTML/Reference/Attributes/rel/noopener).
			widget.ready();

		})();

	</script>

</widget>
